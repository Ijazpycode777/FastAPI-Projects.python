# Smart Campus — local development composition
# Brings up PostgreSQL + the full app (backend serving the built frontend).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartcampus
      POSTGRES_PASSWORD: smartcampus
      POSTGRES_DB: smartcampus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcampus -d smartcampus"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://smartcampus:smartcampus@db:5432/smartcampus
      DATABASE_URL_SYNC: postgresql+psycopg2://smartcampus:smartcampus@db:5432/smartcampus
      SESSION_SECRET_KEY: dev-only-secret-change-me
      SESSION_COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /app/storage/materials
      SEED_RESET_ON_START: "true"
      SEED_ADMIN_EMAIL: admin@smartcampus.edu
      SEED_ADMIN_PASSWORD: ChangeMe!2025
    ports:
      - "8000:8000"
    volumes:
      - app_storage:/app/storage
    restart: unless-stopped

volumes:
  pgdata:
  app_storage:
