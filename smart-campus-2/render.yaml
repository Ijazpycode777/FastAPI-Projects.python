# Render Blueprint for Smart Campus.
# Docs: https://render.com/docs/blueprint-spec
# Apply with: `render blueprint deploy` or via the Render dashboard.

databases:
  - name: smartcampus-db
    plan: starter
    databaseName: smartcampus
    ipAllowList: []        # allow Render-internal services only by default

services:
  - type: web
    name: smartcampus
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smartcampus-db
          property: connectionString
        # Render supplies a postgres:// URL; the app normalizes it to the
        # postgresql+asyncpg driver at runtime (see config.normalize_database_url_for_render).
      - key: SESSION_SECRET_KEY
        sync: false
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: lax
      - key: CORS_ALLOWED_ORIGINS
        value: "https://smartcampus.onrender.com"
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_PATH
        value: /var/data/materials
      # First-admin bootstrap (production). On every startup the app calls
      # bootstrap_admin(): it creates the administrator from SEED_ADMIN_EMAIL /
      # SEED_ADMIN_PASSWORD ONLY if it does not already exist, and never resets
      # an existing admin's password. The generated password is never logged.
      # A deployment refuses to start if no usable admin can be established.
      - key: SEED_ADMIN_EMAIL
        value: admin@smartcampus.edu
      - key: SEED_ADMIN_PASSWORD
        sync: false
        generateValue: true
      # Demo data (synthetic students/teachers/etc.) is dev/staging only and is
      # never seeded into production regardless of this flag. Leave false here.
      - key: SEED_RESET_ON_START
        value: "false"
      - key: PORT
        value: "8000"
    disk:
      name: smartcampus-storage
      mountPath: /var/data
      sizeGB: 5
