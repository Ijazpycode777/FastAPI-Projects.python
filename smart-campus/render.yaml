# Render Blueprint for Smart Campus.
# Docs: https://render.com/docs/blueprint-spec
# Apply with: `render blueprint deploy` or via the Render dashboard.

databases:
  - name: smartcampus-db
    plan: starter
    databaseName: smartcampus
    ipAllowList: []        # allow Render-internal services only by default

services:
  - type: web
    name: smartcampus
    runtime: docker
    plan: starter
    # The Dockerfile lives at the repository root. dockerContext "." is the repo
    # root (NOT a nested subdirectory), so COPY paths in the Dockerfile resolve
    # against the repo root. Apply this blueprint from the repo root.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smartcampus-db
          property: connectionString
        # Render supplies a postgres:// URL; the app normalizes it to the
        # postgresql+asyncpg driver at runtime (see config.normalize_database_url_for_render),
        # and Alembic derives the psycopg2 sync URL from this same var.
      - key: SESSION_SECRET_KEY
        sync: false
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: lax
      - key: CSRF_SECURE
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://smartcampus.onrender.com"
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_PATH
        value: /var/data/materials
      # Permanent seeded administrator (production). On EVERY startup the app
      # calls bootstrap_admin(): it creates the administrator from
      # SEED_ADMIN_EMAIL / SEED_ADMIN_PASSWORD if missing, and RE-SYNCS the
      # password (plus role, is_active, must_reset_password and any lockout) to
      # the configured value on every restart — so the env credential ALWAYS
      # works. Set SEED_ADMIN_PASSWORD to a strong, unique value you know in the
      # Render dashboard; sync: false keeps your manual value across blueprint
      # redeploys. A weak/default password does not block startup, only warns.
      - key: SEED_ADMIN_EMAIL
        value: admin@smartcampus.edu
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Demo data (synthetic students/teachers/etc.) is dev/staging only and is
      # never seeded into production regardless of this flag. Leave false here.
      - key: SEED_RESET_ON_START
        value: "false"
      - key: PORT
        value: "8000"
    disk:
      name: smartcampus-storage
      mountPath: /var/data
      sizeGB: 5
